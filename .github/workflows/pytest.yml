name: Run Backend Unit Tests

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**/*.py"
  pull_request:
    branches: [main, dev]
    paths:
      - "backend/**/*.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend unit tests
        run: |
          pytest -s backend/tests/unit_tests.py

      - name: Install compute_engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r compute_engine/requirements.txt

      - name: Run compute_engine unit tests
        run: |
          pytest -s compute_engine/app/tests.py
