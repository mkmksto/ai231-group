name: Format Python Code

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**/*.py"
  pull_request:
    branches: [main, dev]
    paths:
      - "backend/**/*.py"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Format Python code
        run: |
          ruff format backend/
          ruff check --fix backend/

      - name: Check for formatting changes
        run: |
          git diff --exit-code || (echo "::error::Code formatting issues found. Please run 'ruff format' locally and commit the changes." && exit 1)
